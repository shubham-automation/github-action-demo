name: Scale test

# on:
#   workflow_dispatch:

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod
          
jobs:
  build:
    runs-on: arc-org-runner-set
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_REGISTRY }}
        
  deploy-qa:
    runs-on: arc-org-runner-set
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa' && (startsWith(github.ref_name, 'rel/') || startsWith(github.ref_name, 'hotfix/'))
    environment: qa
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Set AZ Subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group 1-be4cf625-playground-sandbox --name k8s --overwrite-existing

      - name: Get short commit ID
        id: get_commit
        run: |
          SHORT_COMMIT_ID=$GITHUB_SHA
          echo "SHORT_COMMIT_ID is : $SHORT_COMMIT_ID"
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "REPO NAME is: $GITHUB_REPOSITORY"
          kubectl get po -A

      - name: Print Branch Name
        id: print_branch
        run: |
          echo "@@@@@@@ : $BRANCH"

      - name: Generate ACR pull secret
        id: get_dockerconfigjson
        run: |
          SECRET_JSON=$(kubectl create secret docker-registry acr-pull-secret \
            --docker-server=azurecr.io \
            --docker-username=user \
            --docker-password=pass \
            --namespace=dev
            --dry-run=client -o json | jq -r '.data[".dockerconfigjson"]')
          echo "dockerconfigjson=$SECRET_JSON" >> $GITHUB_OUTPUT

      - name: Print docker config
        run: |
          echo "@@@@@@@ : ${{ steps.get_dockerconfigjson.outputs.dockerconfigjson }}"
           
